name: Test

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:

jobs:
  managed-image:
    name: Managed server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker-managed/Dockerfile
          push: false

  check:
    name: Compile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.90"
          override: true

      - uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsodium-dev libx11-dev cmake clang

      - name: Refresh lockfile for the pinned common submodule
        run: cargo update --workspace

      - name: Export resolved lockfile
        uses: actions/upload-artifact@v4
        with:
          name: resolved-cargo-lock
          path: Cargo.lock

      - name: Check compilation
        uses: actions-rs/cargo@v1
        with:
          command: check
          args: --locked --all-features --all-targets

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - uses: actions-rs/toolchain@v1
        with:
          toolchain: "1.90"
          override: true

      - uses: Swatinem/rust-cache@v2

      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libssl-dev libsodium-dev libx11-dev cmake clang

      - name: Run tests
        uses: actions-rs/cargo@v1
        with:
          command: test
          args: --locked --all-features
